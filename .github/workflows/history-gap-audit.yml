name: 過去データの欠損とゼロ出来高を点検
on:
  push:
    branches: [main]
    paths: ['research/history/gap-audit-request.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-gap-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m unittest discover -s research/history -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: history-expansion-encrypted-711eef96040703aa007d0e8c51409b5b8124a2fe
          run-id: 34543739126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/history/encrypted/
      - name: 保存入力と別粒度の価格を照合
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.history.gap_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-gap-public-${{ github.sha }}
          path: diagnostics/history/gap-audit/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-gap-encrypted-${{ github.sha }}
          path: data/history/encrypted/gap-audit.enc
          retention-days: 90
          if-no-files-found: error
