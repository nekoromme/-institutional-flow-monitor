name: 保存データで過去検証を接続
on:
  push:
    branches: [main]
    paths:
      - 'research/history/analysis-request.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: history-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m unittest discover -s research/history -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: history-supplement-encrypted-0bc5930c822001ee8ee6e44704cf7a3269cbc0c3
          run-id: 34538504180
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/history/encrypted/
      - name: 補正内容を点検
        env:
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.history.adjustment_scan
      - name: 固定条件で開発期間を検証
        env:
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.history.development_validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-validation-public-${{ github.sha }}
          path: diagnostics/history/validation/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: history-validation-encrypted-${{ github.sha }}
          path: data/history/encrypted/validation-ledgers.enc
          retention-days: 90
          if-no-files-found: error
