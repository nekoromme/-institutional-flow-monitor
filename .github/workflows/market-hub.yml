name: 株価分析ハブ・検証とデータ更新
on:
  push:
    branches: [main]
    paths: ['market_hub/**', 'tests/hub/**', 'config/market-hub.json', 'config/research-request.json', 'config/source-request.json', '.github/workflows/market-hub.yml']
  pull_request:
    paths: ['market_hub/**', 'tests/hub/**', 'config/market-hub.json', 'config/research-request.json', 'config/source-request.json', '.github/workflows/market-hub.yml']
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * 2-6' # 日本時間 火〜土15:35。NY前日の時間外も終了後に取得。
permissions:
  contents: read
  actions: read
concurrency:
  group: market-hub-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-hub.txt
      - run: python -m unittest discover -s tests/hub -v
      - run: python -m unittest discover -s tests -v
  collect:
    # PRから秘密値を読ませない。検証済みのmainでだけ収集・暗号化する。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-hub.txt
      - name: 前回成功した暗号化キャッシュを探す
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const response = await github.rest.actions.listArtifactsForRepo({owner, repo, name: 'market-hub-cache-v1', per_page: 100});
            for (const artifact of response.data.artifacts) {
              if (artifact.expired || artifact.workflow_run?.head_branch !== 'main') continue;
              const run_id = artifact.workflow_run.id;
              const run = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
              if (run.data.conclusion === 'success' && run.data.path === '.github/workflows/market-hub.yml') {
                core.setOutput('run_id', String(run_id));
                break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        with:
          name: market-hub-cache-v1
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/hub/encrypted/
      - name: キャッシュを復元
        if: steps.previous.outputs.run_id != ''
        env:
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m market_hub unpack
      - name: 価格を更新し品質診断を保存
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m market_hub cycle
      - name: 韓国株・経済データ・オプションの接続と収集
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
        run: python -m market_hub enrich
      - name: DBを暗号化・復号照合
        env:
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m market_hub pack
      - uses: actions/upload-artifact@v4
        with:
          name: market-hub-cache-v1
          path: data/hub/encrypted/hub.enc
          retention-days: 90
          if-no-files-found: error
      - name: 生データを含まない診断だけ公開
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('diagnostics/hub/status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## 株価分析ハブ\n\n')
              f.write('取得銘柄数: '+str(report['symbols'])+' / 件数: '+str(report['records'])+'\n\n')
              f.write('欠損セッションのある銘柄数: '+str(report['symbols_with_missing_sessions'])+'\n\n')
              f.write('生データは暗号化済み。価格・認証情報は公開していません。\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: market-hub-public-status
          path: diagnostics/hub/*.json
          retention-days: 90
          if-no-files-found: error
