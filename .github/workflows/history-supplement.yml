name: 原書類対応後の不足価格を収集
on:
  push:
    branches: [main]
    paths:
      # 結果文書や読取処理の修正だけでは市場データを取り直さない。
      - 'research/history/price-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-supplement
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m unittest discover -s research/history -p 'test_*.py' -v
      - name: 原書類で対応した追加候補の日足を取得
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python -m research.history.supplement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-supplement-public-${{ github.sha }}
          path: diagnostics/history/supplement/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-supplement-encrypted-${{ github.sha }}
          path: data/history/encrypted/additional-*.enc
          retention-days: 90
          if-no-files-found: error
