name: 凪の出来高異常と売買方向を検証
on:
  push:
    branches: [main]
    paths: ['research/history/quiet-request.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-quiet
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m unittest discover -s research/history -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: history-expansion-encrypted-711eef96040703aa007d0e8c51409b5b8124a2fe
          run-id: 34543739126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/history/encrypted/
      - name: 固定条件と理由を定めた2案を比較
        env:
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.history.quiet_trial
      - name: 日足検証が弱ければ約定と気配から方向を推定
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.history.direction_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-quiet-public-${{ github.sha }}
          path: diagnostics/history/quiet/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-quiet-encrypted-${{ github.sha }}
          path: |
            data/history/encrypted/quiet-ledgers.enc
            data/history/encrypted/direction-probe.enc
          retention-days: 90
          if-no-files-found: error
